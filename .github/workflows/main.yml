---
name: Build qnapexporter

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4

      - name: Run hk checks
        run: mise exec -- hk check --all

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, artifact_suffix: amd64 }
          - { goos: linux, goarch: arm, goarm: 5, artifact_suffix: armv5 }
          - { goos: linux, goarch: arm, goarm: 6, artifact_suffix: armv6 }
          - { goos: linux, goarch: arm, goarm: 7, artifact_suffix: armv7 }
          - { goos: linux, goarch: arm64, artifact_suffix: arm64 }

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install mise
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4

      - name: Run tests
        run: mise run test

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          PACKAGE_VERSION: 0.0.${{ github.run_number }}
        run: mise run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qnapexporter-${{ matrix.artifact_suffix }}
          path: bin/qnapexporter
          retention-days: 30

  build-image-qdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build docker image with QDK
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: qpkg/Dockerfile
          tags: qdk-image:latest
          outputs: type=docker,dest=/tmp/qdk-image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qdk-image.tar
          path: /tmp/qdk-image.tar

  build-qpkg:
    runs-on: ubuntu-latest
    needs: [build, build-image-qdk]
    strategy:
      matrix:
        include:
          - { artifact_suffix: amd64 }
          - { artifact_suffix: armv5 }
          - { artifact_suffix: armv6 }
          - { artifact_suffix: armv7 }
          - { artifact_suffix: arm64 }

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download qnapexporter artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: qnapexporter-${{ matrix.artifact_suffix }}
          path: qpkg/shared/

      - name: Download qdk-image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: qdk-image.tar
          path: /tmp

      - name: Set package variables
        id: vars
        run: |
          echo "qpkg_ver=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=QNAPExporter_0.0.${{ github.run_number }}_${{ matrix.artifact_suffix }}.qpkg" >> "$GITHUB_OUTPUT"

      - name: Prepare QPKG build
        run: |
          sed -i 's/QPKG_VER="0.0.0"/QPKG_VER="${{ steps.vars.outputs.qpkg_ver }}"/g' ./qpkg/qpkg.cfg
          chmod 755 qpkg/shared/qnapexporter
          docker load --input /tmp/qdk-image.tar

      - name: Build qpkg for qnapexporter
        run: docker run --rm -v ${{ github.workspace }}:/work qdk-image:latest /usr/share/QDK/bin/qbuild --root /work/qpkg/

      - name: Validate qpkg file size
        run: |
          QPKG_FILE="qpkg/build/QNAPExporter_${{ steps.vars.outputs.qpkg_ver }}.qpkg"
          if [ ! -f "$QPKG_FILE" ]; then
            echo "::error::QPKG file not found: $QPKG_FILE"
            exit 1
          fi
          SIZE=$(stat -c%s "$QPKG_FILE")
          echo "QPKG file size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::QPKG file is too small ($SIZE bytes). Expected at least 1MB. Build likely failed."
            exit 1
          fi

      - name: Validate qpkg trailer
        run: ./qpkg/validate-tail.sh "qpkg/build/QNAPExporter_${{ steps.vars.outputs.qpkg_ver }}.qpkg"

      - name: Add architecture to QPKG artifact filename
        run: cp "qpkg/build/QNAPExporter_${{ steps.vars.outputs.qpkg_ver }}.qpkg" "qpkg/build/${{ steps.vars.outputs.artifact_name }}"

      - name: Upload qpkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: qpkg/build/${{ steps.vars.outputs.artifact_name }}
          retention-days: 30
